plugins {
    id "java"
    id "idea"
    id "application"
    id "java-library"
    id "maven-publish"
    id 'org.springframework.boot' version '2.6.14'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'io.github.DekkerDing'
version = '1.0-SNAPSHOT'
sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8
compileJava.options.encoding "UTF-8"
compileTestJava.options.encoding "UTF-8"


repositories {
    mavenLocal()
    gradlePluginPortal()
    maven { url 'https://repo.springsource.org/plugins-release' }
    maven { url 'https://repo.spring.io/plugins-release-local' }
    maven { url "https://repo.spring.io/plugins-release" }
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/goole' }
    maven { url 'https://maven.aliyun.com/repository/spring' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
    maven { url 'https://repo.spring.io/libs-snapshot' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url "https://repo.spring.io/libs-spring-framework-build" }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url 'https://repo.spring.io/plugins-snapshot' }
    maven { url 'https://plugins.gradle.org/m2/' }
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:3.12.4'
    testImplementation 'org.mockito:mockito-inline:3.12.4'
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testImplementation 'org.testcontainers:testcontainers:1.17.6'
    testImplementation 'org.testcontainers:junit-jupiter:1.17.6'
    testImplementation 'io.lettuce:lettuce-core:6.1.10.RELEASE'
    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-data-redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis:2.6.14'
    // https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.4'
    // https://mvnrepository.com/artifact/com.fasterxml.jackson.datatype/jackson-datatype-jsr310
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.4'
    implementation 'org.redisson:redisson:3.16.8'
    implementation 'org.redisson:redisson-spring-boot-starter:3.16.8'
    implementation 'io.lettuce:lettuce-core:6.8.0.RELEASE'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.13.4'
    implementation 'org.springframework.boot:spring-boot-starter-integration'
    implementation 'org.springframework.integration:spring-integration-redis'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Hutool工具类
    implementation 'cn.hutool:hutool-all:5.8.10'
    // Caffeine缓存(用于幂等性)
    implementation 'com.github.ben-manes.caffeine:caffeine:2.9.3'
    // Apache Commons Pool2 (用于对象池)
    implementation 'org.apache.commons:commons-pool2:2.11.1'
    // Snappy压缩
    implementation 'org.xerial.snappy:snappy-java:1.1.8.4'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

tasks.named('test') {
    useJUnitPlatform()
}
javadoc {
    failOnError false
    afterEvaluate {
        configure(options) {
            encoding "UTF-8"
            charSet 'UTF-8'
            author true
            version true
            failOnError false
            links "http://docs.oracle.com/javase/8/docs/api"
        }
    }
}

jar {
    enabled = true
}

bootJar {
    enabled = true
}

configurations.all() {
    Configuration configuration ->
        resolutionStrategy {
            force 'com.fasterxml.jackson.core:jackson-databind:2.13.4'
            force 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.4'
            force 'com.fasterxml.jackson.core:jackson-annotations:2.13.4'
            force 'org.scala-lang:scala-library:2.13.4'
            force 'org.scala-lang:scala-reflect:2.13.4'
        }
}

gradle.projectsEvaluated {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
}

idea {
    project {
        jdkName = "1.8"
        languageLevel = "1.8"
        vcs = "Git"
    }
}