elasticsearch:
  host: localhost
  port: 9200
  scheme: http
  username: elastic
  password: changeme
  connect-timeout: 5000
  socket-timeout: 30000
  vector-index-name: kb_vector_index_test
  vector-dimension: 1536
  similarity: cosine
  hnsw:
    m: 16
    ef-construction: 100
    ef-search: 50
  index-optimization:
    refresh-interval: 30
    bulk-min-size: 500
    bulk-max-size: 2000
    thread-pool-size: 4
    queue-capacity: 1000
    index-timeout: 60

spring:
  redis:
    host: localhost
    port: 6379
    database: 1
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
