# ================================================
# OpenSpec 项目配置
# Schema: trinity-workflow-v2（三位一体架构工作流 v2）
# Project: knowledge-system (Java DDD)
# Version: 2.2.0 (2026-03-27)
# ================================================
schema: trinity-workflow-v2

# ================================================
# 项目上下文（注入所有产出物）
# ================================================
context: |
  语言：中文（简体）
  所有产出物必须用简体中文撰写。

  # 项目技术栈
  Tech stack: Java 11, Spring Boot 2.3.12, Spring Cloud Hoxton.SR12,
              MyBatis Plus 3.4.2, MySQL 8.0, Redis (Lettuce),
              Elasticsearch 8.12.1, XXL-Job 2.3.1, Redisson 3.17.0,
              Flyway (数据库迁移), Jasypt (敏感配置加密),
              OpenTelemetry (链路追踪), Prometheus (指标采集)

  # ═══════════════════════════════════════════════
  # 【强制】项目规范（所有产出物必须遵守）
  # ═══════════════════════════════════════════════

  在生成任何 design/代码 之前，
  必须先读取以下规范文件作为硬约束，违反规范的产出物视为无效：
  - openspec/project.md                        → 全局约束（项目名、包路径、API前缀、响应封装类）

  [MUST] 生成代码时，每个实现文件必须能在上述规范中找到对应依据。
  [MUST] 若某规范与需求冲突，优先遵守规范，并在findings.md中记录冲突原因。

  # ═══════════════════════════════════════════════
  # Trinity Workflow v2（三位一体架构 v2）
  # ═══════════════════════════════════════════════

  本项目使用 trinity-workflow-v2 schema，它深度集成了 OpenSpec 最佳实践：

  ## 1. 统一追踪层（Planning-with-Files 作为上下文锚点）
  - task_plan.md: 阶段、目标、决策、错误日志
  - findings.md: 技术发现、架构决策 (ADR)
  - progress.md: 会话进度日志、操作记录
  - delta-log.md: Delta Specs 变更记录 (ADDED/MODIFIED/REMOVED)

  Agent 可随时读取这些文件了解：
  - 当前在哪个阶段？
  - 哪些文件已修改？
  - 为什么修改？
  - 下一步是什么？

  ## 2. Schema 驱动的 Artifact 依赖图
  proposal.md ──→ specs/ (Delta) ──→ design.md ──→ tasks.md

  ## 3. Profile 模式（自动选择）
  - Quick: proposal → tasks → apply (单文件修改、Bug Fix)
  - Core: proposal → specs → design → tasks → apply (新功能、多文件)
  - Expanded: 全流程 + verify (复杂功能、跨模块)

  ## 4. 执行层（3-Strike 协议 + Verify 集成）
  - Attempt 1: 诊断并修复
  - Attempt 2: 尝试替代方案
  - Attempt 3: 重新思考问题
  - 3次失败后: 升级给用户

  ## 5. Trinity Skills（内联 OpenSpec 逻辑 + 追踪）
  - /trinity:new     - 创建新变更
  - /trinity:continue - 继续下一个 artifact
  - /trinity:apply   - 执行任务
  - /trinity:verify  - 验证实现
  - /trinity:archive - 归档变更
  - /trinity:ff      - 快速流程

  [MUST] 使用 Trinity Skills 自动管理追踪文件。

  ## 6. 平台兼容性
  - Claude Code: Skills 在 .claude/skills/
  - OpenCode: Skills 在 .opencode/skills/

# ================================================
# 产出物规则（按 artifact 类型）
# ================================================
rules:
  proposal:
    - 字数控制在 500 字以内
    - 必须包含 Non-goals 章节
    - 必须提供 2-3 个方案选项
    - 必须定义成功指标
    - 必须说明涉及哪些 DDD 层次（domain/application/infra/resource）
    - 必须标注受影响的规范文件（如：依据 01-architecture.md §1.4）
  design:
    - 必须包含架构图（含 DDD 分层示意）
    - 必须列出风险与缓解措施
    - 必须说明 Breaking Changes
    - 必须说明数据库变更（新建表须提供建表SQL，符合 03-database.md 规范）
    - 必须说明事务边界（引用 10-transaction.md §1.1 明确事务加在哪一层）
    - API 设计必须符合 02-coding-standards.md §4.3 Controller设计规范
    - 若涉及认证/多租户，必须引用 11-security.md 相关章节
  specs:
    - 使用 Given/When/Then 格式（Gherkin）
    - 覆盖 Happy Path、Edge Cases、Error Cases
    - 错误场景必须对应 04-exception-logging.md 中定义的错误码格式
    - 认证场景必须涵盖 Token 过期、黑名单、跨端访问越权三种情况
  tasks:
    - 每个任务 2-5 分钟可完成
    - 每个任务有明确的验证步骤
    - 任务按批次（Batch）组织
    - 每个涉及新建类的任务必须标注类型（Controller/AppService/DomainService/Repository/PO/DTO/VO）及对应规范章节
    - 每个涉及数据库的任务必须生成 MySQL Flyway 迁移 SQL（见 03-database.md §6）
    - 每个写操作任务必须标注事务策略（见 10-transaction.md §1.12 速查表）
    - 每个涉及 HTTP 接口的任务需标注 URL 前缀（/admin/** 或 /client/** 或 /auth/**）

# ================================================
# 项目规范文件索引（代码生成强制参考）
# ================================================
conventions:
  root: openspec/project.md
  enforce: true               # true = 违反规范的产出物视为无效
  pre_generate_read: true     # true = 每次生成产出物前必须重新读取相关规范

  files:
    - id: architecture
      path: openspec/conventions/01-architecture.md
      scope: [proposal, design, tasks, apply]
      mandate: |
        生成任何代码前必须确认：
        1. 新类所在模块符合 §1.2 模块职责表
        2. AppService 接口返回值为 DTO/VO，禁止返回 domain Model（§1.4）
        3. 依赖方向符合 §1.3 规则，禁止循环依赖
        4. 防腐层 adapter 包在 infra 层（§infra内部包结构）
        5. 领域事件 event / 值对象 valueobject 在 domain 层定义

    - id: coding-standards
      path: openspec/conventions/02-coding-standards.md
      scope: [design, tasks, apply]
      mandate: |
        1. 类命名严格对照 §2 命名规范表（含聚合根/值对象/领域事件/防腐层适配器）
        2. Controller 必须加 @Api、@ApiOperation、@Valid（§3）
        3. 响应统一使用 CommonResponse<T>（§3 响应规范）
        4. 分页请求继承 BasePageReqDTO，响应使用 BasePageResponse<T>（§7/8）
        5. 用户信息获取必须用 @BusinessOperator SessionUserInfo（§9）
        6. 分布式锁使用 Redisson，必须设置 waitTime/leaseTime，finally 释放
        7. 缓存遵循 Cache-Aside 模式，TTL 上下文必须用 TransmittableThreadLocal 传递

    - id: database
      path: openspec/conventions/03-database.md
      scope: [design, tasks, apply]
      mandate: |
        1. 建表 SQL 必须包含 tenant_id/is_deleted/create_time/create_by/update_time/update_by（§2.1）
        2. 生成 MySQL Flyway 迁移 SQL（§6）
        3. PO 必须包含 @TableLogic、@TableField(fill=...) 注解，autoResultMap=true（§8）
        4. Mapper XML 放置在 infra 模块 src/main/resources/mapper/（§7.1）
        5. 禁止 SELECT *，禁止 ${}，禁止无 WHERE 条件的 UPDATE/DELETE（§13）
        6. Repository 接口在 domain 层定义，实现在 infra 层（§9）
        7. 更新操作必须带 tenantId 防越租户，精确更新用 LambdaUpdateWrapper（§7.2）

    - id: exception-logging
      path: openspec/conventions/04-exception-logging.md
      scope: [design, tasks, apply]
      mandate: |
        1. 错误码格式：{system-name}-{type-code}-{seq}（§1.2）
        2. 业务异常抛 BusinessException，系统异常抛 SystemException（§1.1）
        3. 日志必须用占位符，禁止字符串拼接，异常必须打完整堆栈（§2.3/2.4）
        4. 重试场景使用 @Retryable，配置 maxAttempts 和 backoff（§重试机制）

    - id: api-docs
      path: openspec/conventions/05-api-docs.md
      scope: [tasks, apply]
      mandate: |
        1. 所有 Controller 类必须加 @Api(tags = "...")（§1）
        2. 所有接口方法必须加 @ApiOperation（§1）
        3. 所有 DTO/VO 字段必须加 @ApiModelProperty（§2）

    - id: config-env
      path: openspec/conventions/06-config-env.md
      scope: [tasks, apply]
      mandate: |
        1. 配置绑定使用 @ConfigurationProperties，禁止散点 @Value（§3）
        2. 敏感配置使用 Jasypt ENC() 加密（§4）
        3. MybatisPlus 多租户插件和自动填充插件须在配置类中正确注册
        4. Flyway 迁移脚本命名符合规范（§Flyway迁移规范）

    - id: infra-runtime
      path: openspec/conventions/07-infra-runtime.md
      scope: [tasks, apply]
      mandate: |
        1. 禁止 Executors.newFixedThreadPool/newCachedThreadPool（§2.1）
        2. 异步场景必须用 TTL 传递用户上下文（§2.3）
        3. XXL-Job 任务处理器在 infra 层定义，遵循 Handler 命名规范

    - id: observability
      path: openspec/conventions/08-observability.md
      scope: [design, tasks, apply]
      mandate: |
        1. 关键业务方法必须创建 Span，命名格式 {模块}.{操作}，异常必须 recordException（§2.1）
        2. 自定义指标必须在 @PostConstruct 或配置类中预注册，禁止热路径动态创建（§3.1）
        3. 指标命名全小写下划线，Counter 以 _total 结尾，Timer 以 _duration 结尾（§3.3）
        4. 异步线程必须使用 TTL 增强线程池传递 traceId，Span 必须在 finally 中 end()（§1.2/§8）
        5. 业务指标埋点可用 @Timed 注解，结构化日志使用 action=动作名 格式

    - id: unit-test
      path: openspec/conventions/09-unit-test.md
      scope: [tasks, apply]
      mandate: |
        1. 测试类命名 {被测类名}Test.java，方法命名采用 should_预期_when_条件 格式（§1.2）
        2. 每个测试方法严格遵循 AAA（Arrange/Act/Assert）三段式结构（§1.3）
        3. Service层行覆盖率 ≥ 80%，禁止写无断言的空测试（§1.4）
        4. 只 Mock 外部依赖（DB/HTTP/MQ），禁止 Mock 被测类自身（§1.5）
        5. 集成测试使用 Testcontainers，测试类以 IT 结尾（§集成测试规范）

    - id: transaction
      path: openspec/conventions/10-transaction.md
      scope: [design, tasks, apply]
      mandate: |
        1. @Transactional 只加在 AppServiceImpl，其他层禁止（§1.1）
        2. 写操作必须声明 rollbackFor = Exception.class 和 timeout（§1.2/1.5）
        3. 查询方法必须声明 readOnly = true（§1.4）
        4. 禁止事务内发送 MQ 消息，使用 afterCommit() 回调（§1.7）
        5. 批量写操作分批提交，单批 ≤500 条（§1.10）
        6. 禁止 @Transactional 加在 private/final 方法上（§1.11）

    - id: security
      path: openspec/conventions/11-security.md
      scope: [design, tasks, apply]
      mandate: |
        1. Controller 必须用 @BusinessOperator SessionUserInfo 获取用户身份，禁止 @RequestHeader 取 X-User-Id（§1.1）
        2. tenantId 必须从 SessionUserInfo 获取，禁止从请求参数接受（§2.1）
        3. POST/PUT/DELETE 接口必须实现幂等性（§9.1）
        4. 分布式锁必须设置 waitTime 和 leaseTime，finally 释放（§11）
        5. MyBatis 必须用 #{} 参数化，禁止 ${}（§3.2）
        6. 字符串字段必须设置 @Size 上限（§3.1）

    - id: oss-storage
      path: openspec/conventions/07-infra-runtime.md
      scope: [design, tasks, apply]
      mandate: |
        1. 对象命名：<模块>/<数据类型>/<日期>/<应用名-uuid.扩展名>，日期 yyyy/MM/dd，全部小写（§1）
        2. 上传必须使用 platform-support-storage-v2 依赖的 StorageService.upload()（§2.2）
        3. 获取文件前必须先调用 exists() 预检查，再 getFileLocation() 获取 InputStream（§2.3）
        4. 删除文件前必须先调用 exists() 预检查（§2.4）
        5. 禁止直接使用原文件名、空格、中文、特殊符号作为对象命名

    - id: front-arch
      path: openspec/conventions/13-front-arch.md
      scope: [proposal, design, tasks, apply]
      mandate: |
        1. design.md 必须包含 ## Frontend Design 独立 Section（技术栈/文件结构/API层/类型定义/页面组件/路由/导航菜单）
        2. tasks.md 必须包含 Batch 8（前端实现），含类型定义/API函数/页面组件/路由/菜单任务
        3. API 层：模块化组织 api/{module}/index.ts，BASE URL 与后端接口一一对应，禁止业务逻辑（§API 调用规范）
        4. 类型定义：禁止使用 any，TypeScript 接口字段与后端 DTO 一一对应（§类型定义规范）
        5. 页面目录命名全小写+下划线，组件目录命名 PascalCase（§命名规范）
        6. 路由路径全小写+下划线，使用 lazy 懒加载（§路由规范）
        7. 状态管理使用 Zustand + immer，请求使用 useRequest (ahooks)（§状态管理规范）
        8. 组件默认 memo，样式使用 CSS Modules + Less 变量（§组件开发规范/§样式规范）

